server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: jobsearcher
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobsearcher}
    username: ${DB_USER:jobsearcher}
    password: ${DB_PASSWORD:jobsearcher}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/jobsearcher}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/jobsearcher/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origin-patterns: ${CORS_ORIGINS:*}
  security:
    permit-all: ${SECURITY_PERMIT_ALL:false}
  grade-change-cooldown-days: 90
  storage:
    type: local
    local-root: ${STORAGE_ROOT:../storage/uploads}
  llm:
    ollama:
      base-url: ${OLLAMA_BASE_URL:https://ollama.com}
      api-key: ${OLLAMA_API_KEY:}
      model: ${OLLAMA_MODEL:gemma4:31b}
    infereco:
      base-url: ${INFERECO_BASE_URL:https://api.infereco.ru/v1}
      api-key: ${INFERECO_API_KEY:}
      models:
        - ${INFERECO_MODEL_PRIMARY:glm/glm-5.3-flash}
        - ${INFERECO_MODEL_FALLBACK:qwen/qwen3.8-flash-next}
    timeout-ms: 60000

logging:
  level:
    ru.fsp.jobsearcher: INFO
