services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobsearcher
      POSTGRES_USER: jobsearcher
      POSTGRES_PASSWORD: jobsearcher
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobsearcher -d jobsearcher"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - ./docker/keycloak/realm-jobsearcher.json:/opt/keycloak/data/import/realm-jobsearcher.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/jobsearcher
      DB_USER: jobsearcher
      DB_PASSWORD: jobsearcher
      KEYCLOAK_ISSUER_URI: http://keycloak:8081/realms/jobsearcher
      KEYCLOAK_JWK_SET_URI: http://keycloak:8081/realms/jobsearcher/protocol/openid-connect/certs
      SECURITY_PERMIT_ALL: "false"
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      INFERECO_API_KEY: ${INFERECO_API_KEY:-}
      STORAGE_ROOT: /data/uploads
      CORS_ORIGINS: "*"
    ports:
      - "8080:8080"
    volumes:
      - ./storage/uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  pgdata:
